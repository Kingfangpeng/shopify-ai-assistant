[project]
name = "shopify-ai"
version = "0.1.0"
description = "Shopify AI Assistant - LangChain + LangGraph powered ecommerce ops tool"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.136.3",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.31",
    "langchain>=1.3.9",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-milvus>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp[cli]>=1.28.1",
    "fastmcp>=2.0",
    "pymilvus>=2.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "langsmith>=0.8.18",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
