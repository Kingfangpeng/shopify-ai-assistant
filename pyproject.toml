[project]
name = "shopify-ai"
version = "0.1.0"
description = "Shopify AI Assistant - LangChain + LangGraph powered ecommerce ops tool"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-milvus>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp[cli]>=1.0",
    "fastmcp>=2.0",
    "pymilvus>=2.4",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "ShopifyAPI>=12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
